<title>Worksheet 콘솔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 글꼴: Pretendard Variable을 artifact 파일(fonts/)로 함께 게시해 쓴다. 파일이 안 열리면 시스템 글꼴로 내려간다. */
@font-face { font-family: "Pretendard Variable"; font-style: normal; font-weight: 45 920; font-display: swap; src: url("fonts/PretendardVariable.woff2") format("woff2-variations"); }
/* 레이아웃: 상단 단계 막대 + 탭 5개. 게이트 탭은 목록이 본체이고 하단 고정 막대가 승인 조건을 알린다.
   색: 토스트 애니메이션 스튜디오의 갈색(사이트 #9e774a을 글자 대비 4.5:1이 나오게 어둡힌 값)과 로고의 토스트 노랑(#f8b62b).
   시트의 '추정 Frame' 노랑(--est)과 상태색(--s-*)은 의미가 달라 브랜드 색과 따로 둔다. */
:root {
  --bg: #faf6ef; --surface: #ffffff; --surface-2: #f3ece0; --line: #e4d9c6; --fg: #2a2118; --muted: #6a5b49;
  --accent: #8a6232; --accent-hover: #744f26; --accent-fg: #ffffff; --accent-soft: #f6e9d3;
  --brand: #f8b62b; --brand-soft: rgba(248, 182, 43, .38);
  --est: #fff2cc; --est-line: #d9b94c; --ok: #1d7448; --warn: #9a5700; --warn-soft: #fbead0; --bad: #b3261e;
  --s-done: #0ca30c; --s-prog: #2a78d6; --s-fix: #fab219; --s-wait: #c3c2b7; --ink-on-fix: #0b0b0b;
  --font: "Pretendard Variable", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
  --mono: "Pretendard Variable", "Pretendard", "Malgun Gothic", system-ui, sans-serif; /* 고정폭 글꼴 대신 Pretendard. 숫자 폭은 tabular-nums로 맞춘다 */
  --measure: 36rem;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --lift: 0 1px 2px rgba(42, 33, 24, .10), 0 2px 6px rgba(42, 33, 24, .06);
  --ring: 0 0 0 1px var(--line);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17120d; --surface: #211a13; --surface-2: #2b2218; --line: #3d3223; --fg: #f3eadc; --muted: #b5a690;
  --accent: #f8b62b; --accent-hover: #ffc547; --accent-fg: #2a1d08; --accent-soft: #3a2c12;
  --brand-soft: rgba(248, 182, 43, .30);
  --est: #4a3f14; --est-line: #8c7424; --ok: #5dc58c; --warn: #e9a64a; --warn-soft: #3b2c12; --bad: #ff8a80;
  --s-done: #0ca30c; --s-prog: #3987e5; --s-fix: #fab219; --s-wait: #383835; --lift: 0 1px 2px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17120d; --surface: #211a13; --surface-2: #2b2218; --line: #3d3223; --fg: #f3eadc; --muted: #b5a690;
  --accent: #f8b62b; --accent-hover: #ffc547; --accent-fg: #2a1d08; --accent-soft: #3a2c12;
  --brand-soft: rgba(248, 182, 43, .30);
  --est: #4a3f14; --est-line: #8c7424; --ok: #5dc58c; --warn: #e9a64a; --warn-soft: #3b2c12; --bad: #ff8a80;
  --s-done: #0ca30c; --s-prog: #3987e5; --s-fix: #fab219; --s-wait: #383835; --lift: 0 1px 2px rgba(0, 0, 0, .5); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: break-word; line-break: strict; text-wrap: pretty;
  padding-block: 0 88px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
h1 { font-size: 20px; } h2 { font-size: 16px; } h3 { font-size: 14px; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1180px; margin-inline: auto; }
.mono { font-family: var(--mono); font-size: 12px; }
.mono, .tag, .cr .id, .chip, .flow .no, .flow .dot, .big .url { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; padding-block: 18px 12px; }
header.top .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#wideBtn { min-height: 40px; padding-inline: 14px; }
.setup-btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; font-weight: 700; min-height: 40px; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; background: var(--st-wait); color: var(--st-wait-fg); box-shadow: 0 1px 2px rgba(42, 33, 24, .28), 0 3px 10px rgba(180, 83, 9, .32); transition: transform 150ms ease-out, background-color 150ms ease-out; }
.setup-btn.ok { background: var(--st-ok); color: var(--st-ok-fg); box-shadow: 0 1px 2px rgba(42, 33, 24, .28), 0 3px 10px rgba(29, 116, 72, .28); }
.setup-btn:active, .setup .btn:not([disabled]):active { transform: scale(.96); }
.setup { margin-bottom: 16px; display: grid; gap: 14px; border-left: 6px solid var(--st-wait); transition: border-color 150ms ease-out; }
.setup.done { border-left-color: var(--st-ok); }
.setup[hidden] { display: none; }
.setup .btn { min-height: 40px; transition: transform 150ms ease-out, opacity 150ms ease-out; }
.setup .steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; }
.setup .step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
.setup .num { width: 28px; height: 28px; border-radius: 50%; background: var(--fg); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.setup .chk { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.setup .chk.nowrap { flex-wrap: nowrap; }
.setup .lbl { font-size: 13px; font-weight: 700; margin-bottom: -4px; }
.setup input[type="text"] { flex: 1; min-width: 0; min-height: 40px; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 6px 12px; }
.st::before { font-size: 12px; font-weight: 800; }
.st.wait { background: var(--st-wait); color: var(--st-wait-fg); } .st.wait::before { content: "!"; }
.st.busy { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); } .st.busy::before { content: "…"; }
.st.ok { background: var(--st-ok); color: var(--st-ok-fg); } .st.ok::before { content: "✓"; }
.st.bad { background: var(--st-bad); color: var(--st-bad-fg); } .st.bad::before { content: "✕"; }
@media (hover: hover) { .setup .btn.primary:not([disabled]):hover { filter: brightness(1.1); } .setup-btn:hover { filter: brightness(1.08); } }
@media (max-width: 640px) { .setup .chk.nowrap { flex-wrap: wrap; } .setup input[type="text"] { flex-basis: 100%; } }
:root { --st-wait: #b45309; --st-wait-fg: #fff; --st-ok: #1d7448; --st-ok-fg: #fff; --st-bad: #b3261e; --st-bad-fg: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --st-wait: #f0b050; --st-wait-fg: #2a1a00; --st-ok: #5dc58c; --st-ok-fg: #0c2a1a; --st-bad: #ff8a80; --st-bad-fg: #3a0a07; } }
:root[data-theme="dark"] { --st-wait: #f0b050; --st-wait-fg: #2a1a00; --st-ok: #5dc58c; --st-ok-fg: #0c2a1a; --st-bad: #ff8a80; --st-bad-fg: #3a0a07; }
.flow { list-style: none; margin: 0; padding: 14px 8px 10px; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.flow li { flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
.flow li::before { content: ""; position: absolute; top: 15px; right: 50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
.flow li:first-child::before { display: none; }
.flow li.done::before, .flow li.cur::before { background: var(--accent); }
.flow button { background: none; border: 0; padding: 0 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; width: 100%; position: relative; z-index: 1; }
.flow .dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--muted); }
.flow li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.flow li.cur .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--brand-soft); font-weight: 700; }
.flow .tx { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.flow .no { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.flow .tt { font-weight: 700; }
.flow .st { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.flow li.done .st { color: var(--ok); }
.flow li.cur .tt { color: var(--accent); }
.flow li.done.cur .dot { color: var(--accent-fg); }
.flow button[disabled] { cursor: not-allowed; }
.flow button[disabled] .tx { opacity: .5; } /* 원형은 불투명하게 둬서 뒤의 연결선이 비치지 않게 한다 */
.ftree { display: grid; gap: 4px; font-size: 13px; }
.ftree-path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.ftree-f { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.ftree-f svg { color: var(--accent); flex: none; }
.ftree-sep { color: var(--muted); }
.ftree-leaf { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
nav.stages { position: relative; }
#openAll { position: absolute; top: 5px; right: 5px; z-index: 2; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
#openAll:hover { background: var(--surface-2); color: var(--fg); }
#openAll[aria-pressed="true"] { color: var(--accent); }
#openAll:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.flowsum { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
@media (max-width: 640px) {
  .flow { flex-direction: column; gap: 4px; padding: 10px 12px; }
  .flow li { flex-direction: row; align-items: stretch; }
  .flow li::before { top: -4px; right: auto; left: 27px; width: 3px; height: calc(50% + 4px); }
  .flow button { flex-direction: row; gap: 10px; text-align: left; align-items: center; }
  .flow .tx { display: flex; flex-direction: column; align-items: flex-start; }
}
.ttl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ttl h1 { margin: 0; }
.ttl input { font-size: 20px; font-weight: 700; width: min(100%, 26rem); }
.ttl .edit { border: 1px solid transparent; box-shadow: var(--ring); background: var(--surface); border-radius: 6px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
.foot { margin-top: 40px; padding-block: 24px 8px; border-top: 1px solid var(--line); display: flex; justify-content: center; }
.foot img { width: 180px; height: auto; display: block; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 44px; height: auto; flex: none; display: block; }
.series { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .01em; }
.big { display: flex; flex-direction: column; gap: 10px; border-color: var(--accent); }
.big .url { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.dkpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.dkpi div { display: flex; flex-direction: column; border-left: 3px solid var(--line); padding-left: 10px; }
.dkpi b { font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.dkpi span { font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i, .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.s-done { background: var(--s-done); } .s-prog { background: var(--s-prog); } .s-asg { background: color-mix(in srgb, var(--s-prog) 40%, var(--s-wait)); } .s-fix { background: var(--s-fix); } .s-wait { background: var(--s-wait); }
.bar2 { display: flex; gap: 2px; height: 18px; flex: 1; min-width: 120px; }
.pcard .bar2 { flex: none; }
.bar2 span { display: block; height: 100%; border-radius: 0; min-width: 0; }
.bar2 span:first-child { border-radius: 4px 0 0 4px; } .bar2 span:last-child { border-radius: 0 4px 4px 0; } .bar2 span:only-child { border-radius: 4px; }
.bar2 span:focus-visible, .bar2 span:hover { outline: 2px solid var(--fg); outline-offset: 1px; }
.trow { display: grid; grid-template-columns: 110px minmax(120px, 1fr) minmax(130px, 220px); gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.trow:last-child { border-bottom: 0; }
.trow .nums { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.pcard.active { border-color: var(--s-prog); }
.pcard .now { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.pcard .now div { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.mx { border-collapse: collapse; width: 100%; min-width: 560px; font-variant-numeric: tabular-nums; }
.mx th, .mx td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.mx th { font-size: 12px; color: var(--muted); font-weight: 700; }
.mx td.n { text-align: right; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 6px; padding: 5px 9px; font-size: 12px; max-width: 260px; }
section.panel { margin-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.measure { max-width: var(--measure); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
label.f { display: flex; flex-direction: column; gap: 4px; font-weight: 500; }
input[type=text], input[type=number], select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; }
/* 버튼: 깊이는 테두리가 아니라 겹친 그림자로 만들고(강제 색상 모드용 투명 테두리는 남김), 누르면 0.96배로 150ms 줄었다 돌아온다.
   hover 효과는 마우스처럼 hover가 되는 장치에서만, 눌림 크기 변화는 '동작 줄이기'가 꺼진 때만 쓴다. 바꾸는 속성만 이름을 적는다. */
.btn, .filters button, .ttl .edit, .split button, .chip button {
  transition-property: scale, background-color, box-shadow, color, opacity; transition-duration: 150ms; transition-timing-function: var(--ease-out); }
.btn { background: var(--surface); border: 1px solid transparent; border-radius: 6px; padding: 7px 14px; box-shadow: var(--ring), var(--lift); }
.btn.primary { background: var(--accent); color: var(--accent-fg); font-weight: 700; box-shadow: 0 1px 2px rgba(42, 33, 24, .28), 0 2px 8px rgba(138, 98, 50, .28); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: var(--ring); }
.btn.primary[disabled] { box-shadow: none; }
@media (hover: hover) {
  .btn:not([disabled]):hover { background: var(--surface-2); }
  .btn.primary:not([disabled]):hover { background: var(--accent-hover); }
  .filters button:not([aria-pressed="true"]):hover, .ttl .edit:hover, .split button:hover { background: var(--surface-2); }
}
@media (prefers-reduced-motion: no-preference) {
  .btn:not([disabled]):active, .filters button:active, .ttl .edit:active, .split button:active, .chip button:active, .flow button:not([disabled]):active .dot { scale: 0.96; }
  .static:active { scale: 1 !important; }
}
input[type=file] { color: transparent; } /* 브라우저가 붙이는 '선택된 파일 없음' 문구는 숨기고, 고른 파일은 위 줄에 이름으로 보인다 */
input[type=file]::file-selector-button { font: inherit; background: var(--surface); color: var(--fg); border: 1px solid transparent; box-shadow: var(--ring), var(--lift); border-radius: 6px; padding: 6px 12px; margin-right: 10px; cursor: pointer; transition-property: background-color; transition-duration: 150ms; transition-timing-function: var(--ease-out); }
@media (hover: hover) { input[type=file]::file-selector-button:hover { background: var(--surface-2); } }
.flow .dot { transition-property: scale, background-color, box-shadow; transition-duration: 150ms; transition-timing-function: var(--ease-out); }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); }
.drop.has { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.drop.compact { padding: 10px 14px; gap: 8px; }
.drop.compact h3 { margin: 0; font-size: 14px; }
.pick { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.pick .btn { min-height: 36px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.fc { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
.fc.span2 { grid-column: 1 / -1; }
.fc .fh { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
.fc input { width: 100%; min-height: 36px; }
@media (max-width: 560px) { .fgrid { grid-template-columns: 1fr; } }
.checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: grid; grid-template-columns: 54px 1fr; gap: 8px; align-items: baseline; }
.tag { font-family: var(--mono); font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; text-align: center; display: inline-block; }
.tag.pass { background: var(--accent-soft); color: var(--ok); } .tag.wait { background: var(--surface-2); color: var(--muted); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.stats { display: flex; gap: 8px 28px; flex-wrap: wrap; align-items: baseline; padding: 12px 16px; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stats span { font-size: 12px; color: var(--muted); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.filters button { border: 1px solid transparent; box-shadow: var(--ring); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.list { min-width: 820px; }
.lh .sortb { all: unset; cursor: pointer; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; border-radius: 4px; }
.lh .sortb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lh .sortb[aria-pressed="true"] { color: var(--fg); }
.lh, .cr { display: grid; grid-template-columns: 84px 140px minmax(170px, 1fr) minmax(240px, 1.4fr) 72px; gap: 12px; padding: 10px 14px; align-items: start; }
.lh { position: sticky; top: 0; background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line); z-index: 2; }
.cr { border-bottom: 1px solid var(--line); }
.cr:last-child { border-bottom: 0; }
